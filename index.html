<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Nickname Atlas of Europe</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #ffe6f0;
            color: #542f3e;
        }

        .header {
            background-color: #d94f82;
            color: white;
            text-align: center;
            padding: 50px 20px;
            border-bottom: 6px solid #b93668;
        }

        .header h1 {
            margin: 0;
            font-family: Georgia, serif;
            font-size: 40px;
        }

        .header p {
            margin: 15px 0 0;
            color: #ffeaf2;
            font-size: 16px;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 40px auto;
        }

        .card {
            background-color: white;
            padding: 35px;
            border-radius: 15px;
            border-left: 8px solid #f28bb2;
            box-shadow: 0 8px 20px rgba(200, 61, 112, 0.15);
        }

        .card h2 {
            margin-top: 0;
            color: #b93668;
            font-family: Georgia, serif;
            font-size: 28px;
        }

        .card p {
            color: #765260;
            line-height: 1.6;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid #f3a9c5;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background-color: #d94f82;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
        }

        #div1 {
            margin-top: 25px;
            padding: 20px;
            background-color: #fff3f7;
            border: 1px solid #f3b5ca;
            border-radius: 10px;
            min-height: 60px;
            font-size: 18px;
        }

        .footer {
            text-align: center;
            padding: 20px;
            background-color: #b93668;
            color: white;
            font-size: 14px;
            margin-top: 50px;
        }

    </style>
</head>

<body>

    <header class="header">

        <h1>The Nickname Atlas of Europe</h1>

        <p>
            Every country has a name earned through geography,
            history, culture, and myth. Enter a country below to
            discover the nickname it has been given.
        </p>

    </header>

    <main class="container">

        <div class="card">

            <p>COUNTRY LOOKUP</p>

            <h2>Enter a European country</h2>

            <input type="text" id="country" placeholder="Enter a country">

            <button type="submit" py-click="show_nickname">
                REVEAL NICKNAME
            </button>

            <div id="div1"></div>

        </div>

    </main>

    <footer class="footer">
        The Nickname Atlas of Europe
    </footer>

    <py-script src="main.py"></py-script>

</body>
</html>
